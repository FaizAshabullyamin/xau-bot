name: XAUUSD Bot
on:
  schedule:
    - cron: "*/5 * * * 0-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xau-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OFFSET: ${{ vars.OFFSET }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Simpan rekod
        run: |
          git config user.name "xau-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
